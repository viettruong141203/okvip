<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>Trang Chủ | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .loto-card { background: var(--bg-surface); border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; overflow: hidden; margin-top: 20px;}
    .loto-card::before { content:''; position:absolute; top:0;left:0;width:100%;height:6px;background: var(--brand-gradient); }
    .lc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .lc-title { font-weight: 900; font-size: 20px; color: #fff;}
    .lc-balls { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center;}
    .ball { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); color: white; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 20px; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);}
    .btn-bet-now { width: 100%; background: var(--brand-gradient); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 24px var(--brand-shadow); letter-spacing: 1px;}
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
        <div class="logo-area"><i class="fas fa-dice"></i> XS<span>MB</span></div>
        <div class="header-right">
            <div class="balance-badge">
                <span class="balance-text" id="topBalance">0 ₫</span>
                <button class="btn-plus" onclick="window.location.href='add.html'"><i class="fas fa-plus"></i></button>
            </div>
        </div>
    </header>

    <div class="home-content">
        <div class="section-header" style="margin-top: 10px;"><div class="section-title">HỆ THỐNG ĐẶT CƯỢC XSMB</div></div>
        
        <div class="loto-card">
            <div class="lc-header">
                <span class="lc-title">Xổ Số Miền Bắc</span>
                <span style="color: var(--brand-primary); font-weight: bold; font-family: monospace; font-size: 16px; background: rgba(245, 158, 11, 0.1); padding: 4px 12px; border-radius: 20px;"><i class="fas fa-clock"></i> 18:30 MỖI NGÀY</span>
            </div>
            <div class="lc-balls">
                <div class="ball">6</div><div class="ball">8</div><div class="ball">6</div><div class="ball">8</div><div class="ball">8</div>
            </div>
            <button class="btn-bet-now" onclick="window.location.href='loto.html'">TIẾN HÀNH ĐẶT CƯỢC</button>
        </div>

        <div style="text-align: center; margin-top: 30px; font-size: 13px; color: var(--text-muted); font-weight: 600;">
            <i class="fas fa-shield-alt" style="color: var(--brand-primary); font-size: 20px; margin-bottom: 8px; display: block;"></i>
            Hệ thống thanh toán tự động, an toàn và minh bạch tuyệt đối.
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active"><i class="fas fa-home"></i><span>Trang chủ</span></a>
        <a href="loto.html" class="nav-item"><i class="fas fa-bowling-ball"></i><span>Đặt cược</span></a>
        <a href="#" class="nav-item" onclick="alert('CSKH Zalo: 0987.654.321')"><i class="fas fa-headset"></i><span>Hỗ trợ</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i><span>Của tôi</span></a>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
