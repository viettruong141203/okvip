<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi Mật Khẩu | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="form-wrapper">
        <div class="section-header" style="margin-bottom: 24px; padding-top: 10px;">
            <button class="btn-back" onclick="window.history.back()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); width: 40px; height: 40px; border-radius: 12px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center;"><i class="fas fa-chevron-left"></i></button>
            <div class="section-title" style="flex: 1; text-align: center; padding-right: 40px;">ĐỔI MẬT KHẨU</div>
        </div>
        <div class="input-box"><label>Mật khẩu hiện tại</label><input type="password" id="old-pwd" placeholder="Nhập mật khẩu đang sử dụng"></div>
        <div class="input-box"><label>Mật khẩu mới</label><input type="password" id="new-pwd" placeholder="Nhập ít nhất 6 ký tự"></div>
        <div class="input-box"><label>Xác nhận mật khẩu mới</label><input type="password" id="confirm-pwd" placeholder="Nhập lại mật khẩu mới"></div>
        <button class="btn-submit" id="pwdBtn" onclick="changePassword()">CẬP NHẬT MẬT KHẨU</button>
        <div class="sys-msg" id="pwd-msg"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
