<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Cược | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="form-wrapper">
        <div class="section-header" style="margin-bottom: 24px; padding-top: 10px;">
            <button class="btn-back" onclick="window.history.back()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); width: 40px; height: 40px; border-radius: 12px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center;"><i class="fas fa-chevron-left"></i></button>
            <div class="section-title" style="flex: 1; text-align: center; padding-right: 40px;">ĐẶT CƯỢC XSMB</div>
        </div>
        <div class="input-box">
            <label>Hình thức chơi</label>
            <select id="loto-type" onchange="calcLoto()">
                <optgroup label="Nhóm Lô"><option value="Lô 2 số" data-rate="99" data-cost="27">Lô 2 số (27 giải) - 1 ăn 99</option><option value="Lô 2 số 1k" data-rate="3.7" data-cost="27">Lô 2 số 1k (27 giải) - 1 ăn 3.7</option><option value="Lô 3 số" data-rate="980" data-cost="23">Lô 3 số (23 giải) - 1 ăn 980</option><option value="Lô 4 số" data-rate="8880" data-cost="20">Lô 4 số (20 giải) - 1 ăn 8880</option></optgroup>
                <optgroup label="Nhóm Lô Xiên"><option value="Xiên 2" data-rate="16" data-cost="1" data-xien="2">Xiên 2 - 1 ăn 16</option><option value="Xiên 3" data-rate="65" data-cost="1" data-xien="3">Xiên 3 - 1 ăn 65</option><option value="Xiên 4" data-rate="222" data-cost="1" data-xien="4">Xiên 4 - 1 ăn 222</option></optgroup>
                <optgroup label="Nhóm Đề"><option value="Đề đặc biệt" data-rate="99" data-cost="1">Đề Đặc Biệt - 1 ăn 99</option><option value="Đề giải nhất" data-rate="99" data-cost="1">Đề Giải Nhất - 1 ăn 99</option><option value="Đề giải 7" data-rate="99" data-cost="4">Đề Giải 7 (4 giải) - 1 ăn 99</option></optgroup>
                <optgroup label="Nhóm 3 Càng / 4 Càng"><option value="3 Càng Đặc Biệt" data-rate="970" data-cost="1">3 Càng Đặc Biệt - 1 ăn 970</option><option value="3 Càng Giải Nhất" data-rate="970" data-cost="1">3 Càng Giải Nhất - 1 ăn 970</option><option value="4 Càng Đặc Biệt" data-rate="8870" data-cost="1">4 Càng Đặc Biệt - 1 ăn 8870</option></optgroup>
                <optgroup label="Nhóm Đầu / Đuôi"><option value="Đầu" data-rate="9.5" data-cost="1">Đầu - 1 ăn 9.5</option><option value="Đuôi" data-rate="9.5" data-cost="1">Đuôi - 1 ăn 9.5</option></optgroup>
            </select>
        </div>
        <div style="font-size: 13px; color: var(--text-muted); margin-top: -12px; margin-bottom: 20px; font-weight: 600; padding: 0 4px;" id="loto-hint"></div>
        <div class="input-box"><label>Nhập các số cược (Cách nhau dấu phẩy)</label><input type="text" id="loto-nums" placeholder="VD: 68, 86, 99" style="letter-spacing: 2px;" oninput="calcLoto()"></div>
        <div class="input-box"><label>Số tiền cược (Mỗi số / Mỗi điểm)</label><input type="text" id="loto-amount" inputmode="numeric" placeholder="0" oninput="formatInput(this); calcLoto();" style="font-size:32px; color:var(--brand-primary);"></div>
        
        <div style="background: rgba(245, 158, 11, 0.05); border: 1px solid var(--brand-primary); padding: 16px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;"><span style="color: var(--text-muted); font-size: 14px;">Tổng thanh toán:</span><span style="font-weight: 900; color: #fff; font-size: 16px;" id="loto-total">0 ₫</span></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted); font-size: 14px;">Thắng dự kiến:</span><span style="font-weight: 900; color: var(--brand-primary); font-size: 16px;" id="loto-win">0 ₫</span></div>
        </div>
        <button class="btn-submit" id="btn-loto" onclick="submitLoto()">XÁC NHẬN CƯỢC</button>
        <div class="sys-msg" id="msg-loto"></div>
    </div>
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Trang chủ</span></a>
        <a href="loto.html" class="nav-item active"><i class="fas fa-bowling-ball"></i><span>Đặt cược</span></a>
        <a href="#" class="nav-item" onclick="alert('CSKH Zalo: 0987.654.321')"><i class="fas fa-headset"></i><span>Hỗ trợ</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i><span>Của tôi</span></a>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
