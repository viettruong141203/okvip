<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="align-items: center;">
  <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);">
      <div style="text-align: center; margin-bottom: 30px;">
          <i class="fas fa-dice" style="font-size: 44px; color: var(--brand-primary); margin-bottom: 12px; filter: drop-shadow(0 0 10px var(--brand-shadow));"></i>
          <h2 style="font-size: 24px; font-weight: 900; letter-spacing: 1px; margin: 0;">XỔ SỐ ONLINE</h2>
      </div>
      <div id="login-form">
          <div class="input-box" style="padding:10px 16px;"><input type="email" id="login-email" placeholder="E-mail đăng nhập"></div>
          <div class="input-box" style="padding:10px 16px;"><input type="password" id="login-password" placeholder="Mật khẩu"></div>
          <button id="login-btn" class="btn-submit" onclick="submitAuth('login','login-email','login-password','login-btn','login-msg')">Đăng Nhập</button>
          <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); font-weight:600;">Chưa có tài khoản? <span style="color:var(--brand-primary); cursor:pointer;" onclick="document.getElementById('login-form').style.display='none';document.getElementById('register-form').style.display='block';">Đăng ký</span></p>
          <p id="login-msg" class="sys-msg"></p>
      </div>
      <div id="register-form" style="display:none;">
          <div class="input-box" style="padding:10px 16px;"><input type="email" id="reg-email" placeholder="E-mail đăng ký"></div>
          <div class="input-box" style="padding:10px 16px;"><input type="password" id="reg-password" placeholder="Tạo mật khẩu"></div>
          <button id="reg-btn" class="btn-submit" onclick="submitAuth('register','reg-email','reg-password','reg-btn','reg-msg')">Xác Nhận Đăng Ký</button>
          <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); font-weight:600;">Đã có tài khoản? <span style="color:var(--brand-primary); cursor:pointer;" onclick="document.getElementById('register-form').style.display='none';document.getElementById('login-form').style.display='block';">Đăng nhập</span></p>
          <p id="reg-msg" class="sys-msg"></p>
      </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
