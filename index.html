<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Đăng Nhập | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>if(localStorage.getItem("userEmail") && localStorage.getItem("userId")) window.location.replace("dashboard.html");</script>
  <style>
    :root {
      --bg-body: #090e17; --bg-surface: #101827; --border-color: rgba(255, 255, 255, 0.08); 
      --text-main: #f8fafc; --text-muted: #94a3b8; --brand-primary: #f59e0b; 
      --brand-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); --brand-shadow: rgba(245, 158, 11, 0.35);
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent;}
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15), transparent 60%); }
    .auth-box { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
    .form-section { display: none; animation: fadeUp 0.4s ease; } .form-section.active { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .input-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px 16px; margin-bottom: 20px; transition: 0.3s;}
    .input-box:focus-within { border-color: var(--brand-primary); box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }
    .input-box input { width: 100%; border: none; background: transparent; font-size: 15px; font-weight: 600; color: #fff; }
    .btn-submit { width: 100%; background: var(--brand-gradient); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 900; box-shadow: 0 8px 24px var(--brand-shadow); cursor: pointer; text-transform: uppercase;}
    .sys-msg { text-align: center; margin-top: 16px; font-size: 14px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>
  <div class="auth-box">
      <div style="text-align: center; margin-bottom: 30px;">
          <i class="fas fa-dice" style="font-size: 44px; color: var(--brand-primary); margin-bottom: 12px; filter: drop-shadow(0 0 10px var(--brand-shadow));"></i>
          <h2 style="font-size: 24px; font-weight: 900; letter-spacing: 1px; margin: 0;">XỔ SỐ ONLINE</h2>
      </div>
      
      <div id="login-form" class="form-section active">
          <div class="input-box"><input type="email" id="login-email" placeholder="E-mail đăng nhập"></div>
          <div class="input-box"><input type="password" id="login-password" placeholder="Mật khẩu"></div>
          <button id="login-btn" class="btn-submit" onclick="submitAuth('login','login-email','login-password','login-btn','login-msg')">Đăng Nhập</button>
          <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); font-weight:600;">Chưa có tài khoản? <span style="color:var(--brand-primary); cursor:pointer;" onclick="switchForm()">Đăng ký</span></p>
          <p id="login-msg" class="sys-msg"></p>
      </div>
      
      <div id="register-form" class="form-section">
          <div class="input-box"><input type="email" id="reg-email" placeholder="E-mail đăng ký"></div>
          <div class="input-box"><input type="password" id="reg-password" placeholder="Tạo mật khẩu"></div>
          <button id="reg-btn" class="btn-submit" onclick="submitAuth('register','reg-email','reg-password','reg-btn','reg-msg')">Xác Nhận Đăng Ký</button>
          <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); font-weight:600;">Đã có tài khoản? <span style="color:var(--brand-primary); cursor:pointer;" onclick="switchForm()">Đăng nhập</span></p>
          <p id="reg-msg" class="sys-msg"></p>
      </div>
  </div>

  <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbzrZ9KEhDa0GD_aahb-2BbTGi8e46NZwYz-xRs5KBl_WVnSRuyn1aWuVKjziwvwgDvK7Q/exec";
      function switchForm() { document.getElementById("login-form").classList.toggle("active"); document.getElementById("register-form").classList.toggle("active"); document.querySelectorAll(".sys-msg").forEach(m=>m.innerText=""); }
      
      async function submitAuth(action, emailId, passId, btnId, msgId) {
          const email = document.getElementById(emailId).value.trim(); const pass = document.getElementById(passId).value.trim();
          const btn = document.getElementById(btnId); const msg = document.getElementById(msgId);
          if (!email || !pass) return msg.innerText = "Vui lòng nhập đủ thông tin!";
          btn.innerText = "ĐANG XỬ LÝ..."; btn.disabled = true; msg.innerText = "";
          try {
              const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, email, password: pass }) });
              const result = await res.json();
              if (result.status === "success") {
                  msg.style.color = "#34d399"; msg.innerText = result.message;
                  if (action === "login") { localStorage.setItem("userEmail", result.email); localStorage.setItem("userId", result.id); setTimeout(() => window.location.replace("dashboard.html"), 1000); } 
                  else setTimeout(() => { switchForm(); document.getElementById("login-email").value = email; }, 1500);
              } else { msg.style.color = "#f87171"; msg.innerText = result.message; btn.innerText = action === "login" ? "ĐĂNG NHẬP" : "XÁC NHẬN ĐĂNG KÝ"; btn.disabled = false; }
          } catch (e) { msg.style.color = "#f87171"; msg.innerText = "Lỗi kết nối!"; btn.disabled = false; }
      }
  </script>
</body>
</html>
