<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>Xổ Số Online</title>
  
  <script>
    // Kiểm tra đăng nhập
    if (!localStorage.getItem("userEmail") || !localStorage.getItem("userId")) {
        window.location.replace("index.html");
    }
  </script>

  <style>
    /* ================= BẢNG MÀU PREMIUM DARK MODE ================= */
    :root {
      --bg-body: #090e17; 
      --bg-surface: #101827; 
      --bg-surface-hover: #1a2333;
      --border-color: rgba(255, 255, 255, 0.08); 
      --text-main: #f8fafc; 
      --text-muted: #94a3b8;
      
      /* Vàng Neon rực rỡ đặc trưng của Xổ số / Casino */
      --brand-primary: #f59e0b; 
      --brand-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --brand-shadow: rgba(245, 158, 11, 0.35);
      
      --status-pending-text: #fbbf24;
      --status-pending-bg: rgba(251, 191, 36, 0.15);
      --status-success-text: #34d399;
      --status-success-bg: rgba(52, 211, 153, 0.15);
      --status-failed-text: #f87171;
      --status-failed-bg: rgba(248, 113, 113, 0.15);
      
      --sidebar-width: 260px;
      --header-height: 76px;
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
        font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-body); 
        color: var(--text-main); -webkit-font-smoothing: antialiased; display: flex; 
        min-height: 100vh; overflow-x: hidden; transition: 0.3s;
        /* Ánh sáng sau nền */
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05), transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08), transparent 40%);
        background-attachment: fixed;
    }

    input, button { font-family: inherit; }

    /* ================= SIDEBAR ================= */
    .sidebar { 
        position: fixed; top: 0; bottom: 0; left: 0; width: var(--sidebar-width); 
        background: rgba(16, 24, 39, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid var(--border-color); 
        display: flex; flex-direction: column; padding: 24px 16px; z-index: 1000; 
    }
    .brand { font-size: 20px; font-weight: 900; color: var(--text-main); margin-bottom: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; letter-spacing: 0.5px;}
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--brand-gradient); display: flex; justify-content: center; align-items: center; color: white; box-shadow: 0 4px 12px var(--brand-shadow);}
    
    .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
    .nav-item.active { background: var(--brand-gradient); color: white; box-shadow: 0 6px 16px var(--brand-shadow); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.2; fill: none; }
    
    .logout-btn { margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; color: var(--status-failed-text); font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(248, 113, 113, 0.2); background: rgba(248, 113, 113, 0.05); width: 100%; text-align: left; }
    .logout-btn:hover { background: rgba(248, 113, 113, 0.1); }
    .logout-btn:active { transform: scale(0.96); }

    /* ================= MAIN WRAPPER ================= */
    .main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }

    .topbar { position: sticky; top: 0; z-index: 99; height: var(--header-height); padding: 0 32px; background: rgba(9, 14, 23, 0.8); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .topbar-greeting { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .topbar-greeting span { color: var(--brand-primary); }
    .user-profile { display: flex; align-items: center; gap: 20px; }
    .balance-box { display: flex; flex-direction: column; align-items: flex-end; }
    .balance-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}
    .balance-value { font-size: 20px; font-weight: 900; color: var(--brand-primary); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);}
    .avatar { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; color: var(--brand-primary); border: 1px solid var(--border-color); }
    .mobile-logout { display: none; }

    .content-area { padding: 32px; flex: 1; display: flex; flex-direction: column; }
    .page-view { display: none; flex-direction: column; flex: 1; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .page-view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    /* ================= TRANG TỔNG QUAN (HOME) ================= */
    .filter-wrapper { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-wrapper::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 10px 24px; border-radius: 30px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; white-space: nowrap; }
    .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-main); }
    .filter-btn.active { background: var(--text-main); color: var(--bg-body); border-color: var(--text-main); font-weight: 800;}

    .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-content: start; }
    
    .tx-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px 24px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; backdrop-filter: blur(10px);}
    .tx-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: transparent; transition: 0.3s; }
    .tx-card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.04); border-color: rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .tx-card:hover::before { background: var(--brand-primary); }
    .tx-card:active { transform: scale(0.98); }
    
    .tx-left { display: flex; flex-direction: column; gap: 8px; }
    .tx-id-wrap { display: flex; align-items: center; gap: 10px; }
    .tx-id { font-family: monospace; font-size: 16px; font-weight: 800; color: var(--text-main); letter-spacing: 0.5px;}
    .tx-time { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
    
    .tx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .tx-amount { font-weight: 900; font-size: 18px; color: var(--text-main); }
    
    .badge { font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 8px; letter-spacing: 0.5px; }
    .badge.pending { color: var(--status-pending-text); background: var(--status-pending-bg); border: 1px solid rgba(251, 191, 36, 0.2); }
    .badge.success { color: var(--status-success-text); background: var(--status-success-bg); border: 1px solid rgba(52, 211, 153, 0.2);}
    .badge.failed { color: var(--status-failed-text); background: var(--status-failed-bg); border: 1px solid rgba(248, 113, 113, 0.2);}

    /* ================= CÁC FORM CHUNG (CĂN GIỮA) ================= */
    .form-wrapper { display: flex; justify-content: center; align-items: flex-start; padding-top: 20px; flex: 1; }
    .form-container { width: 100%; max-width: 480px; background: var(--bg-surface); border-radius: 24px; padding: 40px 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
    .form-header { text-align: center; margin-bottom: 32px; }
    .form-title { font-size: 22px; font-weight: 900; color: var(--text-main); margin: 0; }

    /* NẠP TIỀN ĐỈNH CAO */
    .amount-input-box { display: flex; align-items: center; background: rgba(0,0,0,0.2); border: 2px solid var(--border-color); border-radius: 16px; padding: 12px 20px; margin-bottom: 24px; transition: 0.3s; }
    .amount-input-box:focus-within { border-color: var(--brand-primary); background: rgba(245, 158, 11, 0.05); box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1); }
    .amount-input-box span { font-size: 18px; font-weight: 900; color: var(--brand-primary); margin-right: 12px; }
    .amount-input-box input { flex: 1; border: none; background: transparent; font-size: 36px; font-weight: 900; color: var(--text-main); outline: none; width: 100%; -webkit-appearance: none; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .amount-input-box input::placeholder { color: rgba(255,255,255,0.1); }
    
    .quick-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
    .quick-btn { padding: 14px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); font-weight: 700; color: var(--text-muted); font-size: 14px; cursor: pointer; transition: 0.2s; }
    .quick-btn:hover { border-color: var(--brand-primary); color: var(--brand-primary); background: rgba(245, 158, 11, 0.1); transform: translateY(-2px);}
    .quick-btn:active { transform: scale(0.96); }

    /* FORM ĐỔI MẬT KHẨU */
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px;}
    .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); font-size: 15px; font-weight: 600; color: var(--text-main); transition: 0.3s; -webkit-appearance: none; }
    .input-group input:focus { border-color: var(--brand-primary); background: rgba(245, 158, 11, 0.05); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }

    /* COPY BUTTON */
    .copy-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; color: var(--text-main); font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .copy-btn:hover { background: var(--brand-primary); border-color: var(--brand-primary); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px var(--brand-shadow);}
    .copy-btn:active { transform: translateY(0); }
    .copy-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;}

    /* NÚT CHÍNH (PRIMARY BUTTON) */
    .btn-main { width: 100%; padding: 18px; background: var(--brand-gradient); color: #ffffff; border: none; border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 24px var(--brand-shadow); letter-spacing: 1px; text-transform: uppercase;}
    .btn-main:hover { filter: brightness(1.1); box-shadow: 0 10px 30px var(--brand-shadow); transform: translateY(-2px);}
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
    .sys-msg { text-align: center; margin-top: 20px; font-size: 14px; font-weight: 700; min-height: 20px; }

    /* ================= TẤM VÉ VIP (VIP TICKET RECEIPT) ================= */
    body.detail-mode .sidebar, body.detail-mode .topbar { display: none !important; }
    body.detail-mode .main-wrapper { margin-left: 0 !important; background-color: #05080f; background-image: radial-gradient(circle at 50% -20%, rgba(245, 158, 11, 0.15), transparent 70%); min-height: 100vh;}
    body.detail-mode .content-area { padding: 0; justify-content: center; align-items: center; }
    
    #view-detail.active { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 100vh; padding: 24px; }

    .vip-ticket { width: 100%; max-width: 420px; background: linear-gradient(180deg, #162032 0%, #0d131f 100%); border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05); position: relative; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    /* Nút Đóng / Quay Lại trên VIP Ticket */
    .btn-close-ticket { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.2s; z-index: 10;}
    .btn-close-ticket:hover { background: rgba(255,255,255,0.1); transform: rotate(90deg);}
    .btn-close-ticket svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; }

    .ticket-header { padding: 48px 32px 32px; text-align: center; position: relative; }
    
    .rc-icon-wrap { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; transition: 0.3s; position: relative;}
    .rc-icon-wrap::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.2); animation: spin 10s linear infinite;}
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .rc-icon-wrap svg { width: 40px; height: 40px; stroke: white; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    
    .rc-status { font-size: 18px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-main);}
    .rc-amount { font-size: 42px; font-weight: 900; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.4));}
    
    /* Vệt cắt đứt đoạn của vé VIP */
    .ticket-cutout { position: relative; height: 40px; background: transparent; overflow: hidden; }
    .ticket-cutout::before, .ticket-cutout::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: #05080f; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
    .ticket-cutout::before { left: -20px; }
    .ticket-cutout::after { right: -20px; }
    .ticket-dashed { position: absolute; top: 50%; left: 30px; right: 30px; border-top: 2px dashed rgba(255,255,255,0.1); transform: translateY(-50%); }

    .ticket-body { padding: 16px 32px 40px; }
    .rc-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .rc-row:last-child { border-bottom: none; }
    .rc-label { color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
    .rc-value { font-weight: 800; color: var(--text-main); font-size: 16px; display: flex; align-items: center; gap: 10px; }
    
    /* Mã vạch Vàng */
    .rc-footer { text-align: center; margin-top: 32px; }
    .rc-barcode { height: 50px; width: 100%; opacity: 0.6; background: repeating-linear-gradient(90deg, var(--brand-primary), var(--brand-primary) 2px, transparent 2px, transparent 6px, var(--brand-primary) 6px, var(--brand-primary) 10px, transparent 10px, transparent 12px); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.3));}
    .rc-thanks { font-size: 11px; color: var(--brand-primary); margin-top: 16px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; opacity: 0.8;}

    /* TOAST THÔNG BÁO */
    .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--brand-primary); color: #000; padding: 14px 28px; border-radius: 30px; font-weight: 800; font-size: 14px; box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 2000; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1024px) { :root { --sidebar-width: 220px; } }
    @media (max-width: 768px) {
        .sidebar { width: 100%; height: 75px; top: auto; bottom: 0; flex-direction: row; padding: 10px 16px; border-right: none; border-top: 1px solid var(--border-color); background: rgba(16, 24, 39, 0.95); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        .brand, .logout-btn, .nav-item span { display: none; } 
        .nav-menu { flex-direction: row; width: 100%; justify-content: space-around; gap: 0; }
        .nav-item { flex-direction: column; padding: 8px; border-radius: 12px; width: auto; flex: 1; justify-content: center; align-items: center; }
        .nav-item.active { background: transparent; color: var(--brand-primary); box-shadow: none; }
        .nav-item.active svg { stroke: var(--brand-primary); stroke-width: 2.5; filter: drop-shadow(0 0 6px var(--brand-shadow));}
        
        body:not(.detail-mode) .main-wrapper { margin-left: 0; padding-bottom: calc(75px + env(safe-area-inset-bottom)); } 
        .topbar { padding: 0 20px; }
        .topbar-greeting { display: none; } 
        .user-profile { width: 100%; justify-content: space-between; }
        
        .mobile-logout { display: flex; align-items: center; justify-content: center; background: var(--status-failed-bg); color: var(--status-failed-text); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 12px; width: 44px; height: 44px; cursor: pointer; }
        
        body:not(.detail-mode) .content-area { padding: 20px; }
        .deck-grid { grid-template-columns: 1fr; gap: 16px; }
        .form-container { padding: 32px 24px; border-radius: 20px; }
        .quick-amounts { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  
  <!-- SIDEBAR -->
  <aside class="sidebar">
      <div class="brand">
          <div class="brand-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><path d="M12 8l4 4-4 4M8 12h8"></path></svg></div>
          XỔ SỐ ONLINE
      </div>
      <nav class="nav-menu">
          <button class="nav-item active" id="nav-home" onclick="navigate('home')">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect></svg>
              <span>Tổng quan</span>
          </button>
          <button class="nav-item" id="nav-add" onclick="navigate('add')">
              <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
              <span>Nạp tiền</span>
          </button>
          <button class="nav-item" id="nav-pwd" onclick="navigate('pwd')">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <span>Đổi mật khẩu</span>
          </button>
      </nav>
      <button class="logout-btn" onclick="confirmLogout()">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Đăng xuất
      </button>
  </aside>

  <!-- MAIN WRAPPER -->
  <main class="main-wrapper">
      
      <!-- TOPBAR -->
      <header class="topbar">
          <div class="topbar-greeting">Xin chào, <span id="displayEmail"></span></div>
          <div class="user-profile">
              <div class="balance-box">
                  <span class="balance-label">Tổng số dư</span>
                  <span class="balance-value" id="displayBalance">0 ₫</span>
              </div>
              <div style="display: flex; gap: 12px; align-items: center;">
                  <div class="avatar"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                  <button class="mobile-logout" onclick="confirmLogout()">
                      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                  </button>
              </div>
          </div>
      </header>

      <section class="content-area">
          
          <!-- TRANG TỔNG QUAN -->
          <div id="view-home" class="page-view active">
              <div class="filter-wrapper">
                  <button class="filter-btn active" onclick="setFilter('All', this)">Tất cả</button>
                  <button class="filter-btn" onclick="setFilter('pending', this)">Đang xử lí</button>
                  <button class="filter-btn" onclick="setFilter('success', this)">Hoàn tất</button>
                  <button class="filter-btn" onclick="setFilter('failed', this)">Thất bại</button>
              </div>
              <div class="deck-grid" id="deckView">
                  <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 15px; font-weight: 600;">
                      Đang đồng bộ dữ liệu với máy chủ...
                  </div>
              </div>
          </div>

          <!-- FORM NẠP TIỀN -->
          <div id="view-add" class="page-view">
              <div class="form-wrapper">
                  <div class="form-container">
                      <div class="form-header">
                          <h3 class="form-title">NẠP TIỀN TÀI KHOẢN</h3>
                      </div>
                      
                      <div class="amount-input-box">
                          <span>VND</span>
                          <input type="text" id="amount" inputmode="numeric" placeholder="0" oninput="formatInput(this)">
                      </div>

                      <div class="quick-amounts">
                          <button class="quick-btn" onclick="setAmount(50000)">50.000</button>
                          <button class="quick-btn" onclick="setAmount(100000)">100.000</button>
                          <button class="quick-btn" onclick="setAmount(200000)">200.000</button>
                          <button class="quick-btn" onclick="setAmount(500000)">500.000</button>
                          <button class="quick-btn" onclick="setAmount(1000000)">1.000.000</button>
                          <button class="quick-btn" onclick="setAmount(5000000)">5.000.000</button>
                      </div>
                      
                      <button class="btn-main" id="submitBtn" onclick="submitForm()">TẠO LỆNH NẠP</button>
                      <div class="sys-msg" id="message"></div>
                  </div>
              </div>
          </div>

          <!-- FORM ĐỔI MẬT KHẨU -->
          <div id="view-pwd" class="page-view">
              <div class="form-wrapper">
                  <div class="form-container">
                      <div class="form-header">
                          <h3 class="form-title">ĐỔI MẬT KHẨU</h3>
                      </div>

                      <div class="input-group">
                          <label>Mật khẩu hiện tại</label>
                          <input type="password" id="old-pwd" placeholder="Nhập mật khẩu đang sử dụng">
                      </div>
                      <div class="input-group">
                          <label>Mật khẩu mới</label>
                          <input type="password" id="new-pwd" placeholder="Ít nhất 6 ký tự">
                      </div>
                      <div class="input-group" style="margin-bottom: 32px;">
                          <label>Xác nhận mật khẩu mới</label>
                          <input type="password" id="confirm-pwd" placeholder="Nhập lại mật khẩu mới">
                      </div>
                      
                      <button class="btn-main" id="pwdBtn" onclick="changePassword()">CẬP NHẬT MẬT KHẨU</button>
                      <div class="sys-msg" id="pwd-msg"></div>
                  </div>
              </div>
          </div>

          <!-- ================= VIP TICKET (CHI TIẾT) ================= -->
          <div id="view-detail" class="page-view">
              <div class="vip-ticket">
                  
                  <div class="ticket-header">
                      <button class="btn-close-ticket" onclick="navigate('home')">
                          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                      </button>
                      
                      <div class="rc-icon-wrap" id="rc-icon-wrapper"></div>
                      <div class="rc-status" id="rc-title-status">Đang xử lí</div>
                      <div class="rc-amount" id="rc-amount-row">0 ₫</div>
                  </div>
                  
                  <div class="ticket-cutout">
                      <div class="ticket-dashed"></div>
                  </div>

                  <div class="ticket-body">
                      <div class="rc-row">
                          <span class="rc-label">Loại giao dịch</span>
                          <span class="rc-value">Nạp tiền tài khoản</span>
                      </div>
                      <div class="rc-row">
                          <span class="rc-label">Mã giao dịch</span>
                          <span class="rc-value">
                              <span id="rc-id" style="font-family: monospace; font-size: 18px; letter-spacing: 1px;"></span> 
                              <button class="copy-btn" onclick="copyText(document.getElementById('rc-id').innerText)">
                                  <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                  Copy
                              </button>
                          </span>
                      </div>
                      <div class="rc-row">
                          <span class="rc-label">Thời gian tạo</span>
                          <span class="rc-value" id="rc-time"></span>
                      </div>
                      
                      <div class="rc-footer">
                          <div class="rc-barcode"></div>
                          <div class="rc-thanks">BIÊN LAI ĐIỆN TỬ - XỔ SỐ ONLINE</div>
                      </div>
                  </div>

              </div>
          </div>

      </section>
  </main>

  <div class="toast" id="toastMsg">Đã sao chép!</div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzrZ9KEhDa0GD_aahb-2BbTGi8e46NZwYz-xRs5KBl_WVnSRuyn1aWuVKjziwvwgDvK7Q/exec";
    const userEmail = localStorage.getItem("userEmail");
    const userId = localStorage.getItem("userId");

    document.getElementById("displayEmail").innerText = userEmail;

    let allTransactions = [];
    let currentFilter = 'All';
    let currentDetailId = null; 
    let isFetching = false;
    let rawDataString = ""; 

    window.onload = () => { loadHistoryData(); setInterval(loadHistoryData, 2000); };

    function navigate(viewId) {
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        if(document.getElementById('nav-'+viewId)) document.getElementById('nav-'+viewId).classList.add('active');
        
        document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        
        // KIỂM SOÁT CHẾ ĐỘ XEM CHI TIẾT
        if(viewId === 'detail') {
            document.body.classList.add('detail-mode');
        } else {
            document.body.classList.remove('detail-mode');
            currentDetailId = null;
        }

        if(viewId === 'add') { document.getElementById('amount').value = ''; document.getElementById('message').innerText = ''; }
        if(viewId === 'pwd') {
            document.getElementById('old-pwd').value = ''; document.getElementById('new-pwd').value = '';
            document.getElementById('confirm-pwd').value = ''; document.getElementById('pwd-msg').innerText = '';
        }
    }

    function confirmLogout() {
        if(confirm("Xác nhận đăng xuất khỏi Xổ Số Online?")) {
            localStorage.clear(); window.location.replace("index.html");
        }
    }

    function formatTimeUI(timeStr) {
        if (!timeStr) return "";
        if (typeof timeStr === 'string' && timeStr.includes('/')) return timeStr; 
        try {
            let d = new Date(timeStr);
            if (isNaN(d.getTime())) return timeStr;
            let hh = String(d.getHours()).padStart(2, '0');
            let mm = String(d.getMinutes()).padStart(2, '0');
            let ss = String(d.getSeconds()).padStart(2, '0');
            let dd = String(d.getDate()).padStart(2, '0');
            let mo = String(d.getMonth() + 1).padStart(2, '0');
            return `${hh}:${mm}:${ss} ${dd}/${mo}/${d.getFullYear()}`;
        } catch(e) { return timeStr; }
    }

    async function loadHistoryData() {
        if(isFetching) return;
        isFetching = true;
        try {
            const response = await fetch(API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "get_history", userId: userId })
            });
            const result = await response.json();
            
            if (result.status === "success") {
                document.getElementById("displayBalance").innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(result.balance || 0);
                const newDataString = JSON.stringify(result.history);
                if(newDataString !== rawDataString) {
                    rawDataString = newDataString;
                    allTransactions = result.history.map(tx => {
                        let rawStatus = tx.status ? tx.status.toLowerCase() : "chờ thanh toán";
                        let mappedStatus = "pending", statusText = "Đang xử lí"; 
                        if (rawStatus.includes("thành công") || rawStatus.includes("hoàn tất") || rawStatus.includes("đã")) { mappedStatus = "success"; statusText = "Hoàn tất"; } 
                        else if (rawStatus.includes("thất bại") || rawStatus.includes("hủy") || rawStatus.includes("thất")) { mappedStatus = "failed"; statusText = "Thất bại"; }
                        return { ...tx, mappedStatus, statusText, timeFormated: formatTimeUI(tx.time) };
                    });
                    applyFilters();
                    if(currentDetailId) openDetail(currentDetailId); 
                }
            }
        } catch (error) {}
        isFetching = false;
    }

    function setFilter(filterType, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = filterType;
        applyFilters();
    }

    function applyFilters() {
        const filtered = allTransactions.filter(tx => (currentFilter === 'All') || (tx.mappedStatus === currentFilter));
        const container = document.getElementById("deckView");
        container.innerHTML = "";

        if (filtered.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 15px; font-weight: 600;">Bạn chưa có giao dịch nào.</div>';
            return;
        }

        filtered.forEach(tx => {
            const displayId = tx.maGiaoDich.replace('TXN', '');
            const amountFormatted = new Intl.NumberFormat('vi-VN').format(tx.amount);
            container.innerHTML += `
            <div class="tx-card" onclick="openDetail('${tx.maGiaoDich}')">
                <div class="tx-left">
                    <div class="tx-id-wrap">
                        <span class="tx-id">#${displayId}</span>
                    </div>
                    <span class="tx-time">${tx.timeFormated}</span>
                </div>
                <div class="tx-right">
                    <span class="tx-amount">${amountFormatted} ₫</span>
                    <span class="badge ${tx.mappedStatus}">${tx.statusText}</span>
                </div>
            </div>`;
        });
    }

    function openDetail(txId) {
        currentDetailId = txId;
        const tx = allTransactions.find(t => t.maGiaoDich === txId);
        if(!tx) return;
        
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById("rc-id").innerText = "#" + tx.maGiaoDich.replace('TXN', '');
        document.getElementById("rc-time").innerText = tx.timeFormated; 
        document.getElementById("rc-amount-row").innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(tx.amount) + ' ₫';
        
        const titleEl = document.getElementById("rc-title-status");
        const iconWrap = document.getElementById("rc-icon-wrapper");
        titleEl.innerText = tx.statusText;
        
        // Thiết kế Icon Glow trên Vé VIP
        if(tx.mappedStatus === 'success') { 
            titleEl.style.color = "var(--status-success-text)"; 
            iconWrap.style.background = "var(--status-success-bg)"; 
            iconWrap.style.boxShadow = "0 0 30px rgba(52, 211, 153, 0.4)";
            iconWrap.innerHTML = '<svg viewBox="0 0 24 24" stroke="var(--status-success-text)"><polyline points="20 6 9 17 4 12"></polyline></svg>'; 
        } 
        else if (tx.mappedStatus === 'failed') { 
            titleEl.style.color = "var(--status-failed-text)"; 
            iconWrap.style.background = "var(--status-failed-bg)"; 
            iconWrap.style.boxShadow = "0 0 30px rgba(248, 113, 113, 0.4)";
            iconWrap.innerHTML = '<svg viewBox="0 0 24 24" stroke="var(--status-failed-text)"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>'; 
        } 
        else { 
            titleEl.style.color = "var(--status-pending-text)"; 
            iconWrap.style.background = "var(--status-pending-bg)"; 
            iconWrap.style.boxShadow = "0 0 30px rgba(251, 191, 36, 0.4)";
            iconWrap.innerHTML = '<svg viewBox="0 0 24 24" stroke="var(--status-pending-text)"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>'; 
        }
        
        navigate('detail');
    }

    function formatInput(input) {
        let val = input.value.replace(/\D/g, '');
        if(val === '') { input.value = ''; return; }
        input.value = new Intl.NumberFormat('vi-VN').format(val);
    }

    function setAmount(val) {
        document.getElementById('amount').value = new Intl.NumberFormat('vi-VN').format(val);
    }

    function generateUniqueMB() {
        let code; let used = allTransactions.map(t => t.content);
        do { code = "MB" + Math.floor(100000 + Math.random() * 900000); } while (used.includes(code));
        return code;
    }

    async function submitForm() {
        let amountStr = document.getElementById('amount').value.replace(/\D/g, '');
        let amount = parseInt(amountStr);
        let msgBox = document.getElementById('message');
        
        if(!amountStr || amount < 2000 || amount > 2000000000) {
            msgBox.style.color = "var(--status-failed-text)"; return msgBox.innerText = "Hạn mức từ 2.000đ đến 2.000.000.000đ!";
        }
        
        document.getElementById('submitBtn').innerText = 'ĐANG XỬ LÝ...';
        document.getElementById('submitBtn').disabled = true;
        msgBox.innerText = "";
        
        try {
            const response = await fetch(API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "create_payment", email: userEmail, userId: userId, amount: amount, content: generateUniqueMB() })
            });
            const result = await response.json();
            if(result.status === "success") {
                msgBox.style.color = "var(--status-success-text)"; msgBox.innerText = "Tạo lệnh thành công!";
                loadHistoryData(); setTimeout(() => { navigate('home'); }, 1500);
            } else { msgBox.style.color = "var(--status-failed-text)"; msgBox.innerText = result.message; }
        } catch(e) { msgBox.style.color = "var(--status-failed-text)"; msgBox.innerText = "Lỗi kết nối máy chủ!"; } 
        finally { document.getElementById('submitBtn').innerText = 'TẠO LỆNH NẠP'; document.getElementById('submitBtn').disabled = false; }
    }

    async function changePassword() {
        const oldPwd = document.getElementById("old-pwd").value;
        const newPwd = document.getElementById("new-pwd").value;
        const confirmPwd = document.getElementById("confirm-pwd").value;
        const msgBox = document.getElementById("pwd-msg");

        if(!oldPwd || !newPwd || !confirmPwd) { msgBox.style.color = "var(--status-failed-text)"; return msgBox.innerText = "Vui lòng nhập đủ thông tin!"; }
        if(newPwd !== confirmPwd) { msgBox.style.color = "var(--status-failed-text)"; return msgBox.innerText = "Mật khẩu mới không khớp!"; }
        if(newPwd.length < 6) { msgBox.style.color = "var(--status-failed-text)"; return msgBox.innerText = "Mật khẩu phải từ 6 ký tự!"; }

        document.getElementById('pwdBtn').innerText = 'ĐANG XỬ LÝ...';
        document.getElementById('pwdBtn').disabled = true;
        msgBox.innerText = "";

        try {
            const response = await fetch(API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "change_password", email: userEmail, userId: userId, oldPassword: oldPwd, newPassword: newPwd })
            });
            const result = await response.json();
            if(result.status === "success") {
                msgBox.style.color = "var(--status-success-text)"; msgBox.innerText = result.message;
                setTimeout(() => { navigate('home'); }, 1500);
            } else { msgBox.style.color = "var(--status-failed-text)"; msgBox.innerText = result.message; }
        } catch(e) { msgBox.style.color = "var(--status-failed-text)"; msgBox.innerText = "Lỗi kết nối!"; } 
        finally { document.getElementById('pwdBtn').innerText = 'CẬP NHẬT MẬT KHẨU'; document.getElementById('pwdBtn').disabled = false; }
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById("toastMsg"); toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2000);
        });
    }
  </script>
</body>
</html>
