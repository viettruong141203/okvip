<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Quản Lý Nạp Tiền</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="align-items: flex-start; padding-top: 20px; padding-bottom: 20px;">

    <div class="dashboard-layout">
        
        <!-- TRÁI: LỊCH SỬ GIAO DỊCH -->
        <div class="main-content">
            <h2 style="text-align: left; margin-bottom: 5px;"><i class="fas fa-history" style="color: #4facfe;"></i> Lịch sử Nạp Tiền</h2>
            <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Quản lý các giao dịch nạp tiền của bạn.</p>
            
            <div id="history-container" class="history-grid">
                <p id="loading-text" style="color: #00f2fe;"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...</p>
            </div>
        </div>

        <!-- PHẢI: SIDEBAR -->
        <div class="sidebar-right">
            <div style="text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-user-circle" style="font-size: 50px; color: #4facfe; margin-bottom: 10px;"></i>
                <div style="font-size: 13px; color: #aaa;">Tài khoản của bạn</div>
                <b id="display-email" style="font-size: 15px; word-break: break-all; color: #fff;"></b>
            </div>
            
            <button class="nav-btn" onclick="loadHistory()">
                <i class="fas fa-sync-alt"></i> Làm mới lịch sử
            </button>

            <button class="nav-btn" onclick="openModal()" style="background: linear-gradient(90deg, #4facfe, #00f2fe); justify-content: center; font-weight: bold; margin-top: 10px; color: #fff; box-shadow: 0 5px 15px rgba(0, 242, 254, 0.3); border: none;">
                <i class="fas fa-plus-circle" style="font-size: 18px;"></i> TẠO ĐƠN NẠP TIỀN
            </button>
            
            <button class="nav-btn logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Đăng xuất
            </button>
        </div>

    </div>

    <!-- POPUP TẠO ĐƠN NẠP -->
    <div class="modal-overlay" id="payment-modal">
        <div class="glass-container modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="color: #00f2fe; margin-bottom: 10px;">Tạo Đơn Nạp</h2>
            <p style="text-align: center; color: #aaa; font-size: 13px; margin-bottom: 20px;">Hạn mức: 2.000đ - 2.000.000.000đ</p>
            
            <div class="input-group">
                <label style="font-size: 13px; color: #ccc; margin-bottom: 5px; display: block;">Số tiền cần nạp (VNĐ)</label>
                <input type="number" id="pay-amount" min="2000" max="2000000000" placeholder="VD: 50000" required style="font-size: 18px; font-weight: bold;">
            </div>
            
            <div class="input-group">
                <label style="font-size: 13px; color: #ccc; margin-bottom: 5px; display: block;">Nội dung chuyển khoản (Tự động sinh)</label>
                <input type="text" id="pay-content" readonly style="background: rgba(0, 0, 0, 0.5); color: #00f2fe; font-weight: bold; text-align: center; font-size: 18px; letter-spacing: 2px;">
            </div>
            
            <button id="pay-btn" onclick="submitPayment()" style="margin-top: 10px;">Xác Nhận Tạo Đơn</button>
            <p id="pay-msg" class="msg"></p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzrZ9KEhDa0GD_aahb-2BbTGi8e46NZwYz-xRs5KBl_WVnSRuyn1aWuVKjziwvwgDvK7Q/exec";
        const userEmail = localStorage.getItem("userEmail");
        const userId = localStorage.getItem("userId");
        let usedCodes = []; // Lưu mã nội dung để chống trùng lặp

        if (!userEmail || !userId) {
            window.location.href = "index.html"; 
        } else {
            document.getElementById("display-email").innerText = userEmail;
            loadHistory(); 
        }

        function formatVND(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        async function loadHistory() {
            const container = document.getElementById("history-container");
            container.innerHTML = '<p id="loading-text" style="color: #00f2fe;"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...</p>';
            
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "get_history", userId: userId })
                });
                
                const result = await response.json();
                container.innerHTML = ""; 
                usedCodes = [];

                if (result.status === "success" && result.history.length > 0) {
                    result.history.forEach(tx => {
                        if(tx.content.startsWith("MB")) usedCodes.push(tx.content);

                        let cardClass = "pending";
                        let statusText = tx.status || "Chờ xử lý";
                        let statusColorClass = "status-pending";
                        
                        if (statusText.toLowerCase().includes("thành công") || statusText.toLowerCase().includes("đã thanh toán")) {
                            cardClass = "success";
                            statusColorClass = "status-success";
                        }

                        const card = `
                            <div class="history-card ${cardClass}">
                                <div class="hc-top">
                                    <span>Mã: ${tx.maGiaoDich}</span>
                                    <span>${tx.time}</span>
                                </div>
                                <div class="hc-amount">${formatVND(tx.amount)}</div>
                                <div class="hc-content"><i class="fas fa-comment-dots"></i> ${tx.content}</div>
                                <div class="hc-status ${statusColorClass}"><i class="fas fa-info-circle"></i> ${statusText}</div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p style="color: #aaa;">Bạn chưa có giao dịch nào.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #ff4d4d;">Lỗi tải dữ liệu. Vui lòng thử lại sau.</p>';
            }
        }

        function generateUniqueCode() {
            let mbCode;
            do {
                let code = Math.floor(100000 + Math.random() * 900000); // Tạo 6 số ngẫu nhiên
                mbCode = "MB" + code;
            } while (usedCodes.includes(mbCode)); 
            return mbCode;
        }

        const modal = document.getElementById("payment-modal");
        
        function openModal() {
            document.getElementById("pay-amount").value = "";
            document.getElementById("pay-content").value = generateUniqueCode();
            document.getElementById("pay-msg").innerText = ""; 
            modal.classList.add("active");
        }

        function closeModal() { modal.classList.remove("active"); }
        window.onclick = function(event) { if (event.target === modal) closeModal(); }

        async function submitPayment() {
            const amountInput = document.getElementById("pay-amount").value.trim();
            const content = document.getElementById("pay-content").value.trim();
            const btn = document.getElementById("pay-btn");
            const msgBox = document.getElementById("pay-msg");

            if (!amountInput) return (msgBox.style.color = "#ff4d4d", msgBox.innerText = "Vui lòng nhập số tiền!");

            const amount = parseInt(amountInput);
            if (amount < 2000 || amount > 2000000000) {
                return (msgBox.style.color = "#ff4d4d", msgBox.innerText = "Số tiền phải từ 2,000 VNĐ đến 2,000,000,000 VNĐ!");
            }

            btn.innerText = "Đang xử lý...";
            btn.disabled = true;
            msgBox.innerText = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "create_payment", email: userEmail, userId: userId, amount: amount, content: content
                    })
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    msgBox.style.color = "#00e676";
                    msgBox.innerText = `Thành công! Mã đơn: ${result.transactionCode}`;
                    setTimeout(() => { closeModal(); loadHistory(); }, 1500);
                } else {
                    msgBox.style.color = "#ff4d4d";
                    msgBox.innerText = result.message;
                }
            } catch (error) {
                msgBox.style.color = "#ff4d4d";
                msgBox.innerText = "Lỗi kết nối máy chủ!";
            } finally {
                btn.innerText = "Xác Nhận Tạo Đơn";
                btn.disabled = false;
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
