<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nạp Tiền | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="form-wrapper">
        <div class="section-header" style="margin-bottom: 24px; padding-top: 10px;">
            <button class="btn-back" onclick="window.history.back()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); width: 40px; height: 40px; border-radius: 12px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center;"><i class="fas fa-chevron-left"></i></button>
            <div class="section-title" style="flex: 1; text-align: center; padding-right: 40px;">NẠP TIỀN TÀI KHOẢN</div>
        </div>
        <div class="input-box"><label>Số tiền nạp (VND)</label><input type="text" id="amount-add" inputmode="numeric" placeholder="0" oninput="formatInput(this)" style="font-size:32px; color:var(--brand-primary);"></div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px;">
            <button onclick="setAmount('amount-add', 50000)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">50K</button>
            <button onclick="setAmount('amount-add', 100000)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">100K</button>
            <button onclick="setAmount('amount-add', 200000)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">200K</button>
            <button onclick="setAmount('amount-add', 500000)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">500K</button>
            <button onclick="setAmount('amount-add', 1000000)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">1 TRIỆU</button>
            <button onclick="setAmount('amount-add', 5000000)" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">5 TRIỆU</button>
        </div>
        <button class="btn-submit" id="btn-add" onclick="submitDeposit()">TẠO LỆNH NẠP</button>
        <div class="sys-msg" id="msg-add"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
