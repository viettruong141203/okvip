<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử Nạp Tiền</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="form-wrapper">
        <div class="section-header" style="margin-bottom: 24px; padding-top: 10px;">
            <button class="btn-back" onclick="window.history.back()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); width: 40px; height: 40px; border-radius: 12px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center;"><i class="fas fa-chevron-left"></i></button>
            <div class="section-title" style="flex: 1; text-align: center; padding-right: 40px;">LỊCH SỬ NẠP TIỀN</div>
        </div>
        <div id="historyList-deposit"><div style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px;">Đang tải dữ liệu...</div></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
