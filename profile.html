<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Của Tôi | Xổ Số Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div style="padding: 40px 20px 24px; text-align: center; border-bottom: 1px solid var(--border-color); background: var(--bg-surface);">
        <div id="displayEmail" style="font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 12px;"></div>
        <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px;">TỔNG SỐ DƯ (VND)</div>
        <div id="displayBalanceBig" style="font-size: 40px; font-weight: 900; color: var(--brand-primary); text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);">0</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 24px 20px;">
        <a href="add.html" style="background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 10px;border-radius:16px;text-align:center;font-weight:800;font-size:13px;color:var(--text-main);display:flex;flex-direction:column;align-items:center;gap:10px;"><i class="fas fa-wallet" style="font-size:26px;color:var(--brand-primary);"></i>Nạp Tiền</a>
        <a href="withdraw.html" style="background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 10px;border-radius:16px;text-align:center;font-weight:800;font-size:13px;color:var(--text-main);display:flex;flex-direction:column;align-items:center;gap:10px;"><i class="fas fa-hand-holding-usd" style="font-size:26px;color:var(--brand-primary);"></i>Rút Tiền</a>
        <a href="bank.html" style="background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 10px;border-radius:16px;text-align:center;font-weight:800;font-size:13px;color:var(--text-main);display:flex;flex-direction:column;align-items:center;gap:10px;"><i class="fas fa-university" style="font-size:26px;color:var(--brand-primary);"></i>Ngân Hàng</a>
    </div>
    <div style="padding: 0 20px;">
        <div class="section-header"><div class="section-title">QUẢN LÝ LỊCH SỬ</div></div>
        <a href="history_deposit.html" style="display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 20px;border-radius:16px;font-weight:700;font-size:15px;margin-bottom:12px;"><div style="width:44px;height:44px;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:20px;margin-right:16px;background:rgba(52,211,153,0.1);color:#34d399;"><i class="fas fa-arrow-down"></i></div><div style="flex: 1;">Lịch sử Nạp Tiền</div><i class="fas fa-chevron-right" style="color:var(--text-muted);"></i></a>
        <a href="history_withdraw.html" style="display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 20px;border-radius:16px;font-weight:700;font-size:15px;margin-bottom:12px;"><div style="width:44px;height:44px;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:20px;margin-right:16px;background:rgba(248,113,113,0.1);color:#f87171;"><i class="fas fa-arrow-up"></i></div><div style="flex: 1;">Lịch sử Rút Tiền</div><i class="fas fa-chevron-right" style="color:var(--text-muted);"></i></a>
        <a href="history_bet.html" style="display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 20px;border-radius:16px;font-weight:700;font-size:15px;margin-bottom:12px;"><div style="width:44px;height:44px;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:20px;margin-right:16px;background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fas fa-dice"></i></div><div style="flex: 1;">Lịch sử Đặt Cược</div><i class="fas fa-chevron-right" style="color:var(--text-muted);"></i></a>
        <a href="pwd.html" style="display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border-color);padding:16px 20px;border-radius:16px;font-weight:700;font-size:15px;margin-bottom:12px;"><div style="width:44px;height:44px;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:20px;margin-right:16px;background:rgba(255,255,255,0.1);color:#fff;"><i class="fas fa-lock"></i></div><div style="flex: 1;">Đổi mật khẩu</div><i class="fas fa-chevron-right" style="color:var(--text-muted);"></i></a>
        <button class="btn-submit" style="background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); margin-top: 24px; box-shadow: none;" onclick="confirmLogout()"><i class="fas fa-power-off" style="margin-right: 8px;"></i> ĐĂNG XUẤT</button>
    </div>
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Trang chủ</span></a>
        <a href="loto.html" class="nav-item"><i class="fas fa-bowling-ball"></i><span>Đặt cược</span></a>
        <a href="#" class="nav-item" onclick="alert('CSKH Zalo: 0987.654.321')"><i class="fas fa-headset"></i><span>Hỗ trợ</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user-circle"></i><span>Của tôi</span></a>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
